name: ci

# The release pipeline lives here now. Owned by:
#
#   eka get walkie/ts:build-release-matrix
#
# which took the former smoke-build floor and made it real: the complete
# default-build matrix produced as checksummed artifacts (release), static
# linking and CGO-freeness asserted on the produced bytes (release-verify,
# inside the Makefile), reproducibility demonstrated by double build
# (reproducibility), the zig cc audio matrix (audio), and the coordinator
# container image (container).
#
# Two properties this workflow deliberately keeps, inherited from the floor:
#
#   - No C toolchain is installed anywhere in the default-build path. If a
#     step there needs one, a dependency has broken adr:002-runtime-stack's
#     pure-Go property, and that is an architectural problem, not a CI
#     problem.
#   - Nothing is pushed anywhere: no tags, no releases, no registry. Releasing
#     is a human action; this workflow proves the pipeline produces what a
#     human would release.
#
# The audio job is expected to be RED right now. That is honest, not broken:
# zig is absent and the audio spike was canceled before settling the libopus
# binding, so there is nothing for zig cc to compile yet. See that job's first
# step before "fixing" the red.

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # adr:002-runtime-stack: the default build is pure Go and fully static.
      # This is the guard that makes that real rather than aspirational.
      - name: Default build must not require CGO
        run: make check-cgo

      - name: Test (default variant)
        run: make test

      - name: Test (voice variant)
        run: make test-voice

      - name: Vet
        run: go vet ./...

      - name: Module is tidy
        run: make tidy

  release:
    name: release artifacts (default build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # One job, not a GOOS/GOARCH matrix, on purpose. The target list belongs
      # to the Makefile (DEFAULT_MATRIX) — duplicating it as YAML matrix
      # entries would create two lists that can drift apart silently. It also
      # lets criterion 6's SHA256SUMS cover the whole matrix as ONE artifact,
      # which is what gets verified against after download.
      #
      # Criteria 1 and 2 are settled by these two lines plus the assertions
      # inside release-verify: every target produced with CGO_ENABLED=0 and no
      # C toolchain present, then the produced bytes themselves checked for
      # static linkage and CGO-freeness — asserted, not commented.
      - name: Produce checksummed artifacts for every default target
        run: make release

      - name: Verify artifacts are static and CGO-free
        run: make release-verify

  reproducibility:
    name: builds are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Criterion 4 says the same commit produces identical artifacts. That is
      # a claim about bytes, so CI settles it with bytes: two full runs of the
      # release target from one checkout, digest files diffed. Without this
      # step the property rots silently the first time someone adds a
      # timestamp to an ldflags stamp; with it, that commit goes red.
      - name: Same commit, two builds, identical digests
        run: make release-repro-check

  audio:
    name: audio build (zig cc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # This job is ALLOWED TO BE RED, and must never be made green by
      # skipping. Criterion 3 needs zig cc, but two things are missing today:
      # zig is not on stock runners, and walkie/spk:audio-toolchain-viability
      # was canceled before settling how libopus reaches arm64 — so the voice
      # tree contains no C units at all yet, and even a green run here would
      # prove pipeline mechanics, not an audio build. A missing toolchain
      # therefore fails LOUDLY below. When the spike reruns and a binding
      # lands, installing zig here is the only change this job needs.
      - name: zig toolchain must be present
        run: |
          if ! command -v zig >/dev/null 2>&1; then
            echo "::error::zig is not installed — the audio-build matrix cannot run (criterion 3 of ts:build-release-matrix). Install zig, or gate this job only after walkie/spk:audio-toolchain-viability reruns and settles the libopus binding. Do NOT convert this failure into a silent skip."
            exit 1
          fi

      - name: Build audio matrix via zig cc
        run: make release-audio

  container:
    name: coordinator container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds the image and stops there. Running it — proving a tsnet join
      # works without host networking — needs a live tailnet and an auth key,
      # which no CI environment here provides, so runtime behaviour remains
      # UNVERIFIED by this workflow. The verification procedure that would
      # settle it is written down in deploy/coordinator/README.md. Host
      # networking and privileged mode are forbidden answers to that gap, not
      # workarounds for it: see the Dockerfile header.
      - name: Build image (never pushed)
        run: |
          docker build -f deploy/coordinator/Dockerfile \
            --build-arg VERSION="$(git rev-parse HEAD)" \
            -t walkie-coordinator:ci .

      - name: Image exists
        run: docker image inspect walkie-coordinator:ci > /dev/null

  proto:
    name: proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking compares against another ref, so it needs history.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # buf is pinned as a Go tool dependency in go.mod, which is what makes
      # `make proto` reproducible: every developer runs the same version with no
      # separately installed binary. It has one real cost — buf is a large program
      # and building it from source takes minutes on a cold Go build cache, which
      # is the normal state of a CI runner. So this job keeps buf-setup-action to
      # fetch a prebuilt binary of the SAME version, and overrides the Makefile's
      # BUF to use it.
      #
      # The version is read out of go.mod rather than written here a second time.
      # Two hand-maintained version numbers drift, and the drift would surface as
      # a `make proto-check` diff that looks like a schema change and is not one —
      # exactly the failure the pin exists to prevent.
      - name: Resolve the pinned buf version from go.mod
        id: buf
        run: echo "version=$(go list -m -f '{{.Version}}' github.com/bufbuild/buf | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ steps.buf.outputs.version }}
          # Without a token the action's release lookup is rate limited per runner
          # IP, which fails this job for reasons unrelated to the schema.
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint schema
        run: buf lint

      # Committed generated code must match proto/. This is what lets the repo
      # be built with no codegen toolchain while staying trustworthy. BUF=buf is
      # the prebuilt binary resolved above; the codegen plugin still comes from
      # go.mod, so no Buf Schema Registry call happens here.
      - name: Generated code is in sync
        run: make proto-check BUF=buf

      # adr:003-wire-protocol: the fleet runs mixed client versions, so a
      # renumbered or reused field number is a runtime break with no
      # compile-time signal. Checked mechanically rather than by review.
      - name: Schema stays backward compatible
        run: buf breaking --against '.git#branch=main'
