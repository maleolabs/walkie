syntax = "proto3";

package walkie.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/maleolabs/walkie/internal/genproto/walkie/v1;walkiev1";

// walkie's control plane.
//
// Owning work item:
//
//   eka get walkie/ts:protocol-schema-v1
//
// This file is a SKELETON. It establishes the envelope pattern, the package
// path and the compatibility discipline; ts:protocol-schema-v1 fills in the
// remaining message set.
//
// Design constraints from adr:003-wire-protocol:
//
//   - The control plane is one WebSocket per client to the coordinator,
//     carrying protobuf envelopes with a oneof payload per message type.
//   - Unknown fields must be ignored, not rejected. The fleet will run mixed
//     client versions and will not upgrade in lockstep, so a newer coordinator
//     talking to an older client has to keep working. proto3 gives this for
//     free as long as nobody reuses a field number.
//   - Real-time audio does NOT travel here. It uses the UDP data plane with
//     RTP framing, because a retransmitted frame arriving after its playback
//     deadline is worthless. Voice NOTES are different: they are attachments
//     with no deadline, and they do travel over this control plane.
//
// COMPATIBILITY RULE: field numbers are permanent. Never renumber and never
// reuse a number from a removed field — mark it `reserved` instead. `buf
// breaking` enforces this in CI; do not bypass it.

// Envelope wraps every control-plane message.
message Envelope {
  // message_id is a ULID generated by the sender. It makes redelivery
  // idempotent: the receiver discards a duplicate rather than the wire
  // preventing one. req:offline-delivery specifies at-least-once delivery with
  // receiver-side deduplication, so this field is load-bearing, not
  // diagnostic.
  string message_id = 1;

  // sent_at is the sender's clock. Keep it even though it is untrustworthy:
  // clock skew across the fleet is expected, and req:text-messaging requires
  // retaining both this and the coordinator's receive time so the skew stays
  // legible to the user rather than being silently resolved.
  google.protobuf.Timestamp sent_at = 2;

  oneof payload {
    Hello hello = 10;
    HelloAck hello_ack = 11;
    Heartbeat heartbeat = 12;

    // TODO(ts:protocol-schema-v1): the remaining MVP message set —
    //   presence update and status change   (sto:device-presence)
    //   direct message and broadcast        (sto:text-messaging)
    //   attachment transfer for voice notes (sto:voice-note)
    //   queue drain and acknowledgement     (sto:offline-queue)
    //   public-key announce and directory   (ts:queue-sealed-box)
    // Continue numbering from 13 upward. Do not renumber what is above.
  }
}

// Hello opens a connection.
//
// It deliberately carries no credential of any kind. adr:004-security-model
// resolves the caller's identity from the tailnet with a WhoIs lookup on the
// connection's remote address, so there is no password, token or session
// identifier anywhere in this protocol. Adding one here would be a design
// regression, not a hardening step.
message Hello {
  // client_version is for diagnostics and compatibility reporting only. Never
  // branch protocol behaviour on it — that is what field-level compatibility
  // is for.
  string client_version = 1;

  // last_acked_position resumes the offline queue where this device left off,
  // instead of replaying everything. Zero means "I have nothing yet".
  // req:offline-delivery requires resumption by position.
  uint64 last_acked_position = 2;
}

// HelloAck completes the handshake.
message HelloAck {
  // device is the identity the coordinator resolved from the tailnet. The
  // client does not assert this; it learns it.
  string device = 1;

  // received_at is the coordinator's clock, the trustworthy half of the
  // timestamp pair.
  google.protobuf.Timestamp received_at = 2;

  // pending_count is how many queued messages are about to be delivered, so
  // the client can tell the user rather than appearing to hang.
  uint64 pending_count = 3;
}

// Heartbeat keeps the connection observably alive.
//
// This is an application-level heartbeat and it is not redundant with TCP: a
// socket can stay open while the peer is gone. req:device-presence makes
// presence server-authoritative with a liveness TTL derived from these, which
// is why a client may not announce its own online state — a device that is
// killed cannot send a goodbye, and would otherwise appear online forever.
message Heartbeat {}
